name: Deploy DREADVORN to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate game JavaScript syntax
        run: |
          node --version
          node -e 'const fs=require("fs");const html=fs.readFileSync("index.html","utf8");const match=html.match(/<script type="module">([\s\S]*?)<\/script>/);if(!match)throw Error("Game module script not found");fs.writeFileSync("/tmp/dreadvorn.mjs",match[1]);'
          node --check /tmp/dreadvorn.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
