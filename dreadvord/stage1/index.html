<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DREADVORD — Stage 1 Prototype</title>
<style>
html,body{margin:0;height:100%;background:#080a0d;color:#e8decf;font-family:system-ui,Segoe UI,Arial;overflow:hidden}
#game{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:rgba(8,10,13,.86);border:1px solid rgba(216,180,106,.12);padding:8px;border-radius:10px}
#bars{position:absolute;left:12px;top:12px;width:min(260px,36vw)}.label{font-size:11px;color:#cfc6b7;margin-bottom:6px}
.bar{height:10px;background:#1a1a1a;border-radius:8px;overflow:hidden}
.fill{height:100%;width:100%;background:#6b2f2f}
#controls{position:fixed;inset:0;pointer-events:none}
#stickArea{position:absolute;left:16px;bottom:18px;width:120px;height:120px;border-radius:50%;background:rgba(18,18,18,.36);pointer-events:auto}
#stick{position:absolute;left:50%;top:50%;width:44px;height:44px;background:#c49b49;border-radius:50%;transform:translate(-50%,-50%)}
.actions{position:absolute;right:18px;bottom:18px;display:grid;grid-template-columns:repeat(2,68px);gap:10px;pointer-events:auto}
.action{width:68px;height:68px;border-radius:12px;background:#2b1f1a;color:#fff;border:0;font-weight:800}
#objective{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:8px 12px;border-radius:8px}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center}
.card{background:#0b0d10;padding:18px;border-radius:12px;border:1px solid rgba(216,180,106,.12);color:#e7dccb}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="bars" class="panel">
    <div class="label">VITALITY</div>
    <div class="bar"><div id="hp" class="fill" style="width:100%"></div></div>
    <div class="label" style="margin-top:8px">STAMINA</div>
    <div class="bar"><div id="stam" class="fill" style="width:100%;background:#6b8736"></div></div>
  </div>
  <div id="objective" class="panel">MISSION: ENTER THE RUINED GATE — Reach the castle gate</div>
</div>
<div id="controls">
  <div id="stickArea"><div id="stick"></div></div>
  <div class="actions">
    <button id="attack" class="action">ATTACK</button>
    <button id="dodge" class="action">DODGE</button>
    <button id="guard" class="action">GUARD</button>
    <button id="pause" class="action">PAUSE</button>
  </div>
</div>
<div id="overlay"><div class="card"><h2 id="endTitle">PAUSED</h2><p id="endText">Game is paused.</p><div style="margin-top:12px"><button id="resume" class="action">RESUME</button></div></div></div>
<script type="module">
import {Game} from './src/Game.js';
const game = new Game({mount:document.getElementById('game')});
game.start();
// pause/resume
const overlay=document.getElementById('overlay');const resume=document.getElementById('resume');const pauseBtn=document.getElementById('pause');pauseBtn.addEventListener('pointerdown',()=>{game.togglePause();overlay.style.display=game.paused?'flex':'none';});resume.addEventListener('pointerdown',()=>{game.togglePause();overlay.style.display='none';});
</script>
</body>
</html>
