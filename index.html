<title>DREADVORN — Outbreak</title>
<style>
:root{color-scheme:dark;--lime:#c6f36b;--panel:rgba(9,15,12,.82);--line:rgba(198,243,107,.34)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111713;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}

.brand strong{display:block;letter-spacing:.14em;font-size:15px;color:var(--lime)}.brand small{font-size:10px;letter-spacing:.13em;color:#bdc6b9}

@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}#rotate span{display:block;font-size:14px;font-weight:500;line-height:1.6;color:#c4cfbf;margin-top:10px}}

#stick{position:absolute;left:43px;top:43px;width:50px;height:50px;border-radius:50%;background:rgba(198,243,107,.7);border:2px solid #e5ffc0;box-shadow:0 0 20px #9dd44b44}
#fire{pointer-events:auto;position:absolute;right:22px;bottom:max(35px,env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;border:2px solid #ffd0bd;background:rgba(157,45,29,.78);color:#fff;font-weight:900;letter-spacing:.08em;touch-action:none;box-shadow:0 0 22px #e34b3033}
#fire:active{transform:scale(.95);background:#d43f28}
.action{pointer-events:auto;position:absolute;right:24px;border:1px solid rgba(198,243,107,.55);border-radius:10px;background:rgba(14,23,17,.88);color:#eaf6d9;font-weight:800;letter-spacing:.06em;padding:10px 12px;touch-action:none;font-size:11px}
#reload{bottom:max(126px,calc(env(safe-area-inset-bottom) + 126px))}#interact{bottom:max(178px,calc(env(safe-area-inset-bottom) + 178px));display:none}

#overlay{position:fixed;inset:0;background:rgba(5,8,6,.78);display:none;align-items:center;justify-content:center;text-align:center;color:white;padding:24px}

@media(min-width:800px){#stickArea,#fire{opacity:.72}.brand strong{font-size:18px}#hint{bottom:24px}}
</style>
</head>

 const roof=new THREE.Mesh(new THREE.BoxGeometry(w+.5,.28,d+.5),mats.dark);roof.position.y=h+.12;roof.castShadow=true;g.add(roof);
 for(let y=1.25;y<h-0.5;y+=1.65){for(let xx=-w/2+1;xx<w/2-.3;xx+=2.15){const win=new THREE.Mesh(new THREE.BoxGeometry(.95,.82,.08),mats.window);win.position.set(xx,y,d/2+.045);g.add(win);const sill=new THREE.Mesh(new THREE.BoxGeometry(1.05,.09,.18),mats.rust);sill.position.set(xx,y-.47,d/2+.08);g.add(sill)}}

makeBuilding(-12,-10,10,8,8,.12);makeBuilding(13,-15,9,10,11,-.2);makeBuilding(-20,12,8,11,6,.4);makeBuilding(20,14,12,8,9,-.5);makeBuilding(0,-30,16,8,7,0);

makeBuilding(-1,-18,13,9,8,0);
box(1.8,.45,.16,new THREE.MeshStandardMaterial({color:0x9d3029,emissive:0x250504}),-1,6.2,-13.35,false);
box(.45,1.8,.16,new THREE.MeshStandardMaterial({color:0x9d3029,emissive:0x250504}),-1,6.2,-13.35,false);
for(let i=0;i<32;i++){const x=(Math.random()-.5)*76,z=(Math.random()-.5)*76;if(Math.abs(x)<8&&Math.abs(z)<8)continue;const h=.5+Math.random()*1.5;box(.8+Math.random()*1.6,h,.7+Math.random()*1.5,Math.random()>.5?mats.dark:mats.rust,x,h/2,z)}

for(let i=0;i<13;i++){const x=(Math.random()-.5)*68,z=(Math.random()-.5)*68;if(Math.abs(x)<10&&Math.abs(z)<10)continue;const trunk=box(.35,2.5,.35,mats.dark,x,1.25,z);for(let j=0;j<3;j++){const limb=box(.18,1.3,.18,mats.dark,x+(Math.random()-.5)*1.3,2+Math.random(),z+(Math.random()-.5)*1.3);limb.rotation.z=(Math.random()-.5)*1.4}}

// Small world pickups turn the district into an exploration loop.

makePickup('ammo','Ammo box',4,-5,0xc6f36b);
makePickup('med','Medical supplies',-9,-2,0x62d8a2);
makePickup('intel','Hospital incident report',-1,-25,0xd6c58c);

document.querySelector('#interact').addEventListener('pointerdown',e=>{e.preventDefault();interact()});

// Player: simple readable 3D survivor with rifle.
const player=new THREE.Group();scene.add(player);
const torso=new THREE.Mesh(new THREE.BoxGeometry(.72,1.05,.42),mats.player);torso.position.y=1.35;torso.castShadow=true;player.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(.27,12,10),mats.skin);head.position.y=2.08;head.castShadow=true;player.add(head);
const legs=[];for(const x of [-.22,.22]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.25,.72,.28),mats.dark);leg.position.set(x,.43,0);leg.castShadow=true;player.add(leg);legs.push(leg)}
const arm=new THREE.Mesh(new THREE.BoxGeometry(.22,.72,.23),mats.player);arm.position.set(.48,1.42,-.12);arm.rotation.z=-.35;player.add(arm);
const rifle=new THREE.Mesh(new THREE.BoxGeometry(.16,.16,.9),new THREE.MeshStandardMaterial({color:0x171c19,metalness:.65,roughness:.4}));rifle.position.set(.48,1.48,-.62);player.add(rifle);
const muzzle=new THREE.Object3D();muzzle.position.set(.48,1.48,-1.08);player.add(muzzle);
player.position.set(0,0,4);
const worldForward=new THREE.Vector3(0,0,-1);
let cameraYaw=0,cameraPitch=.08,lookPointer=null,lastLookX=0,lastLookY=0;
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());

 if(e.pointerType==='mouse'&&e.button!==2)return;

const zombies=[];let health=100,kills=0,gameOver=false,fireClock=0,damageClock=0,ammo=12,reserve=60,reloading=false,reloadClock=0;
function makeZombie(x,z){const g=new THREE.Group();const skin=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.24+Math.random()*.07,.22,.38+Math.random()*.12),roughness:.95});
 const body=new THREE.Mesh(new THREE.BoxGeometry(.68,1.0,.4),skin);body.position.y=1.15;body.castShadow=true;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.25,10,8),skin);head.position.y=1.83;head.castShadow=true;g.add(head);
 for(const lx of [-.2,.2]){const l=new THREE.Mesh(new THREE.BoxGeometry(.23,.68,.25),mats.red);l.position.set(lx,.36,0);l.castShadow=true;g.add(l)}
 for(const ax of [-.46,.46]){const a=new THREE.Mesh(new THREE.BoxGeometry(.18,.7,.2),skin);a.position.set(ax,1.15,-.05);a.rotation.z=ax<0?-.22:.22;g.add(a)}
 g.position.set(x,0,z);scene.add(g);zombies.push({group:g,hp:3,speed:1.0+Math.random()*.45,attack:0,hit:0,skin})}
function spawnInitialInfected(){
 // A small, persistent outbreak around the hospital district; no arcade waves.
 const positions=[[-11,-4],[12,-8],[-16,-16],[15,5],[-7,-24],[21,-19]];

spawnInitialInfected();
const stickArea=document.querySelector('#stickArea'),stick=document.querySelector('#stick'),fireBtn=document.querySelector('#fire');
let moveX=0,moveY=0,stickPointer=null,fireHeld=false;

 const from=player.position.clone().add(new THREE.Vector3(0,1.5,0));const forward=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),cameraYaw);let target=null,best=34;
 for(const z of zombies){if(z.hp<=0)continue;const p=z.group.position.clone().add(new THREE.Vector3(0,1.1,0)),d=p.clone().sub(from),dist=d.length();if(dist>best)continue;const angle=forward.angleTo(d.normalize());if(angle<.34){best=dist;target=z}}

}

document.querySelector('#restart').addEventListener('click',restart);
const clock=new THREE.Clock();let walkT=0;
function updateDayNight(dt){
 gameMinutes=(gameMinutes+dt*2.4)%(24*60);
 const hour=gameMinutes/60;
 const daylight=THREE.MathUtils.smoothstep(hour,5.2,8.0)*(1-THREE.MathUtils.smoothstep(hour,17.2,20.2));
 const sunset=Math.max(THREE.MathUtils.smoothstep(hour,16.8,18.5)*(1-THREE.MathUtils.smoothstep(hour,18.5,20.2)),THREE.MathUtils.smoothstep(hour,4.5,6.2)*(1-THREE.MathUtils.smoothstep(hour,6.2,7.4)));

 if(sunset>.01){sky.copy(daySky).lerp(sunsetSky,sunset*.82).lerp(nightSky,1-daylight)}else sky.copy(nightSky).lerp(daySky,daylight);
 scene.background.copy(sky);scene.fog.color.copy(sky);

 sun.position.set(Math.cos((hour-12)/12*Math.PI)*35,Math.sin((hour-6)/12*Math.PI)*38,12);
 moon.position.set(-sun.position.x,Math.max(8,30-sun.position.y),-18);

}
function collidesWithBuilding(x,z){

}
function update(dt){updateDayNight(dt);if(gameOver)return;fireClock=Math.max(0,fireClock-dt);damageClock=Math.max(0,damageClock-dt);if(reloading){reloadClock-=dt;if(reloadClock<=0){const n=Math.min(12-ammo,reserve);ammo+=n;reserve-=n;reloading=false;updateAmmo();document.querySelector('#hint').textContent='MAGAZINE READY';}}if(fireHeld)shoot();
 let ix=moveX,iy=moveY;if(keys.a||keys.arrowleft)ix-=1;if(keys.d||keys.arrowright)ix+=1;if(keys.w||keys.arrowup)iy-=1;if(keys.s||keys.arrowdown)iy+=1;const mag=Math.hypot(ix,iy);if(mag>1){ix/=mag;iy/=mag}
 const moving=Math.abs(ix)+Math.abs(iy)>.06;
 let nearestPickup=2.7;for(const p of pickups){if(p.used)continue;const d=player.position.distanceTo(p.group.position);if(d<nearestPickup)nearestPickup=d;}document.querySelector('#interact').style.display=nearestPickup<2.7?'block':'none';
 if(moving){
  const speed=keys.shift?7.1:5.2;
  const sin=Math.sin(cameraYaw),cos=Math.cos(cameraYaw);
  const dx=(ix*cos+iy*sin)*speed*dt,dz=(-ix*sin+iy*cos)*speed*dt;
  const oldX=player.position.x,oldZ=player.position.z;
  if(!collidesWithBuilding(oldX+dx,oldZ))player.position.x+=dx;
  if(!collidesWithBuilding(player.position.x,oldZ+dz))player.position.z+=dz;
  player.position.x=THREE.MathUtils.clamp(player.position.x,-78,78);player.position.z=THREE.MathUtils.clamp(player.position.z,-78,78);
  const moveAngle=Math.atan2(-dx,-dz);player.rotation.y=moveAngle;
  walkT+=dt*(keys.shift?15:10);legs[0].rotation.x=Math.sin(walkT)*.48;legs[1].rotation.x=-Math.sin(walkT)*.48;
 }else{legs.forEach(l=>l.rotation.x=0)}
 const cameraDistance=8.8;
 const desired=new THREE.Vector3(player.position.x+Math.sin(cameraYaw)*cameraDistance,5.0+cameraPitch*5,player.position.z+Math.cos(cameraYaw)*cameraDistance);
 camera.position.lerp(desired,1-Math.pow(.001,dt));
 camera.lookAt(player.position.x,1.25,player.position.z);

 for(const z of zombies){z.attack=Math.max(0,z.attack-dt);const delta=player.position.clone().sub(z.group.position);const dist=delta.length();if(dist>1.25){delta.normalize();z.group.position.addScaledVector(delta,z.speed*dt);z.group.rotation.y=Math.atan2(-delta.x,-delta.z)}else if(z.attack<=0){z.attack=1.0;if(damageClock<=0){setHealth(health-9);damageClock=.3}}
 if(z.hit>0){z.hit-=dt;z.group.position.y=.04}else z.group.position.y=0;
 }
}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);update(dt);renderer.render(scene,camera)}
camera.position.set(0,5.2,12);camera.lookAt(0,1,0);animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight)});
document.querySelector('#hint').textContent=matchMedia('(pointer:coarse)').matches?'Left stick to move · Drag open screen to look · FIRE to shoot · RELOAD to refill':'WASD to move · Right mouse drag to look · SPACE to shoot · R to reload · SHIFT to sprint';
try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(e){}
</script>
